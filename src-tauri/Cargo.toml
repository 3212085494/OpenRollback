[package]
name = "openrollback"
version = "0.1.0"
description = "AI Agent system-level safety net and time machine"
authors = ["OpenRollback Contributors"]
edition = "2021"
default-run = "openrollback"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openrollback_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
anyhow = "1.0.102"
rusqlite = { version = "0.40.0", features = ["bundled"] }
notify = "8.2.0"
sha2 = "0.10.9"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
tempfile = "3.27.0"

[[bin]]
name = "openrollback-mcp"
path = "src/bin/openrollback_mcp.rs"

[[bin]]
name = "openrollback-demo"
path = "src/bin/openrollback_demo.rs"

[[bin]]
name = "inspect-db"
path = "src/bin/inspect_db.rs"

[[bin]]
name = "openrollback-e2e-autotest"
path = "src/bin/openrollback_e2e_autotest.rs"

[[bin]]
name = "openrollback-release-verify"
path = "src/bin/openrollback_release_verify.rs"


